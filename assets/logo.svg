<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 158" width="100" height="158">
  <!-- Combined city buildings + location pin shape -->
  <!-- Pin body -->
  <path d="M8,74 C6,100 28,140 50,155 C72,140 94,100 92,74 Z" fill="#0C2340"/>
  <!-- Left building -->
  <rect x="17" y="32" width="22" height="44" fill="#0C2340"/>
  <!-- Center building (tallest) -->
  <rect x="41" y="6" width="18" height="70" fill="#0C2340"/>
  <!-- Right building -->
  <rect x="61" y="24" width="20" height="52" fill="#0C2340"/>

  <!-- White circle (pin marker hole) -->
  <circle cx="50" cy="100" r="16" fill="white"/>

  <!-- Windows - Left building (2x2 grid) -->
  <rect x="22" y="38" width="4" height="4" fill="white"/>
  <rect x="30" y="38" width="4" height="4" fill="white"/>
  <rect x="22" y="48" width="4" height="4" fill="white"/>
  <rect x="30" y="48" width="4" height="4" fill="white"/>

  <!-- Windows - Center building (stacked) -->
  <rect x="48" y="15" width="4" height="4" fill="white"/>
  <rect x="48" y="27" width="4" height="4" fill="white"/>

  <!-- Window - Right building -->
  <rect x="69" y="32" width="4" height="4" fill="white"/>
</svg>
